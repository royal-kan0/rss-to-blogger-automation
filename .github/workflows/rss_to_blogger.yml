name: RSS to Blogger Automation

on:
  schedule:
    # three runs per day: 00:00, 08:00, 16:00 UTC
    - cron: "0 0 * * *"
    - cron: "0 8 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rss_to_blogger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps for Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libxcomposite1 libxrandr2 libxdamage1 libxkbcommon0 libgbm1 libgtk-3-0 libasound2t64 libffi8 libx264-164
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install browsers for Playwright
          python -m playwright install --with-deps

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase true
          git config --global rebase.autostash true
          echo "✅ Git configured with auto-stash enabled"

      - name: Run RSS to Blogger automation
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          RSS_FEED_URLS: ${{ secrets.RSS_FEED_URLS }}
          MAX_POSTS_PER_RUN: ${{ secrets.MAX_POSTS_PER_RUN || '10' }}
          POSTS_PER_DAY_LIMIT: ${{ secrets.POSTS_PER_DAY_LIMIT || '50' }}
        run: |
          echo "🚀 Starting RSS to Blogger automation..."
          python main.py
