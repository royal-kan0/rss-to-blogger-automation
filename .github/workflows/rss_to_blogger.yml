name: RSS to Blogger Automation

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 8 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rss_to_blogger:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies and Playwright Browsers
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Verify required secrets exist
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          RSS_FEED_URLS: ${{ secrets.RSS_FEED_URLS }}
        run: |
          python - <<'PY'
          import os, sys
          required = [
              "BLOGGER_BLOG_ID",
              "BLOGGER_CLIENT_ID",
              "BLOGGER_CLIENT_SECRET",
              "BLOGGER_REFRESH_TOKEN",
              "RSS_FEED_URLS",
          ]
          missing = [k for k in required if not os.getenv(k)]
          if missing:
              print("Missing required env vars:", ", ".join(missing))
              sys.exit(1)
          print("All required environment variables are present.")
          PY

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase true
          git config --global rebase.autostash true
          echo "✅ Git configured"

      - name: Run RSS to Blogger automation
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          RSS_FEED_URLS: ${{ secrets.RSS_FEED_URLS }}
          MAX_POSTS_PER_RUN: ${{ secrets.MAX_POSTS_PER_RUN || '10' }}
          POSTS_PER_DAY_LIMIT: ${{ secrets.POSTS_PER_DAY_LIMIT || '50' }}
        run: |
          echo "🚀 Starting RSS to Blogger automation..."
          python main.py
